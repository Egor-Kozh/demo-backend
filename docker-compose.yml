services:
  auth-service:
    container_name: auth-service
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - backend-network
  
  users-service:
    container_name: users-service
    build:
      context: ./user-service
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    networks:
      - backend-network

  product-service:
    container_name: product-service
    build:
      context: ./product-service
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    networks:
      - backend-network

  company-service:
    container_name: company-service
    build:
      context: ./company-service
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    networks:
      - backend-network

  type_product-service:
    container_name: type_product-service
    build:
      context: ./type_product-service
      dockerfile: Dockerfile
    ports:
      - "8084:8080"
    networks:
      - backend-network

  nginx-server:
    image: nginx
    container_name: nginx-server
    ports:
      - '8070:8080'
    volumes:
      - './nginx.conf:/etc/nginx/nginx.conf'
    networks:
      - backend-network
    depends_on:
      - users-service
      - auth-service
      - product-service
      - company-service
      - type_product-service

networks:
  backend-network:
    external: true
    driver: bridge

